<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VirtuBox Display Wall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #FFFCF8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer scaler: fits 1920x1080 canvas to any screen resolution */
        .canvas-scaler {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1920px;
            height: 1080px;
            transform-origin: center center;
            transform: translate(-50%, -50%) scale(1);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        .canvas {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #FFFCF8;
            contain: strict;
        }

        .corner {
            position: absolute;
            top: 0;
            left: 0;
            width: 220px;
            height: 220px;
            z-index: 10;
            pointer-events: none;
        }

        .corner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .banner {
            position: absolute;
            top: 0;
            right: 0;
            width: 565px;
            height: 1116px;
            background: #A5A5A5;
            overflow: hidden;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .col {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 37px;
        }

        .col-1 {
            left: 158px;
            top: -33px;
        }

        .col-2 {
            left: 441px;
            top: -285px;
        }

        .col-3 {
            left: 731px;
            top: -33px;
        }

        .col-4 {
            left: 1026px;
            top: -33px;
        }

        /* Photo Frame Base Style & GPU Layer */
        .frame {
            width: 244px;
            height: 323px;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            contain: layout paint;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
        }

        /* Idle wave motion */
        .frame.frame-wave {
            animation: frameWave 3.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
        }

        @keyframes frameWave {
            0% {
                transform: translate3d(0, -22px, 0);
            }

            100% {
                transform: translate3d(0, 22px, 0);
            }
        }

        /* Slide transition when shifting frames */
        .frame.sliding {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .frame .slot {
            width: 100%;
            height: 100%;
            background: #D0ECF8;
            position: relative;
            overflow: hidden;
        }

        .frame .slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Fade out for exiting top frame */
        .frame.fade-out {
            opacity: 0;
            transform: translate3d(0, -15px, 0) scale(0.82) !important;
        }

        /* Pop-in animation for newly added photo at slot 14 */
        .frame.entry-pop {
            animation: smoothEntryPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
        }

        @keyframes smoothEntryPop {
            0% {
                opacity: 0;
                transform: scale(0.85);
            }

            60% {
                opacity: 1;
                transform: scale(1.03);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="canvas-scaler" id="canvasScaler">
        <div class="canvas">
            <div class="corner">
                <img id="cornerImg" src="https://static.virtubox.io/catalog/file/20260821-052955-tqif-group.png" alt="">
            </div>

            <div class="col col-1">
                <div class="frame frame-wave" id="f1">
                    <div class="slot" id="s1"></div>
                </div>
                <div class="frame frame-wave" id="f2">
                    <div class="slot" id="s2"></div>
                </div>
                <div class="frame frame-wave" id="f3">
                    <div class="slot" id="s3"></div>
                </div>
                <div class="frame frame-wave" id="f4">
                    <div class="slot" id="s4"></div>
                </div>
            </div>
            <div class="col col-2">
                <div class="frame frame-wave" id="f5">
                    <div class="slot" id="s5"></div>
                </div>
                <div class="frame frame-wave" id="f6">
                    <div class="slot" id="s6"></div>
                </div>
                <div class="frame frame-wave" id="f7">
                    <div class="slot" id="s7"></div>
                </div>
                <div class="frame frame-wave" id="f8">
                    <div class="slot" id="s8"></div>
                </div>
            </div>
            <div class="col col-3">
                <div class="frame frame-wave" id="f9">
                    <div class="slot" id="s9"></div>
                </div>
                <div class="frame frame-wave" id="f10">
                    <div class="slot" id="s10"></div>
                </div>
                <div class="frame frame-wave" id="f11">
                    <div class="slot" id="s11"></div>
                </div>
            </div>
            <div class="col col-4">
                <div class="frame frame-wave" id="f12">
                    <div class="slot" id="s12"></div>
                </div>
                <div class="frame frame-wave" id="f13">
                    <div class="slot" id="s13"></div>
                </div>
                <div class="frame frame-wave" id="f14">
                    <div class="slot" id="s14"></div>
                </div>
            </div>

            <div class="banner" id="banner"></div>
        </div>
    </div>

    <!-- 1. API Config (Credentials & Services) -->
    <script src="API_config.js"></script>
    <!-- 2. Main Logic Script -->
    <script src="config.js"></script>
</body>

</html>
